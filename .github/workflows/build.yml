name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build with Maven
        run: mvn -B -f CheckPoints/pom.xml clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: CheckPoints-jar
          path: CheckPoints/target/*.jar
          if-no-files-found: error

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        run: mvn -B -f CheckPoints/pom.xml deploy -DskipTests
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Publish to Hangar (Release/Beta/Alpha from version)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
        run: |
          if [ -z "$HANGAR_API_TOKEN" ]; then echo "HANGAR_API_TOKEN not set, skipping Hangar publish for CheckPoints"; exit 0; fi
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f CheckPoints/pom.xml)
          COMMIT_DESC=$(git log -1 --pretty=%B)
          if [[ "$VERSION" == *"-alpha"* ]]; then CHANNEL=Alpha; elif [[ "$VERSION" == *"-beta"* ]]; then CHANNEL=Beta; else CHANNEL=Release; fi
          echo "Publishing CheckPoints $VERSION to Hangar FragMC/CheckPoints channel $CHANNEL"
          echo "$COMMIT_DESC" > /tmp/changelog.txt
          JWT=$(curl -s -X POST "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_API_TOKEN" | grep -o '"token":"[^"]*' | cut -d'"' -f4)
          if [ -z "$JWT" ]; then echo "Hangar auth failed for CheckPoints"; exit 0; fi
          curl -s -X POST "https://hangar.papermc.io/api/v1/projects/FragMC/CheckPoints/versions" -H "Authorization: $JWT" -F "channel=$CHANNEL" -F "version=$VERSION" -F "changelog=@/tmp/changelog.txt" -F "files=@CheckPoints/target/checkpoints-$VERSION.jar;type=application/java-archive" -F "platform=PAPER" -F "platformVersions=[\"26.2\"]" || echo "Hangar publish failed for CheckPoints (ignoring)"

      - name: Create GitHub Release with commit description as Maven release notes
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f CheckPoints/pom.xml)
          COMMIT_DESC=$(git log -1 --pretty=%B)
          echo "Version: $VERSION"
          echo "$COMMIT_DESC"
          gh release create "v$VERSION" --title "CheckPoints $VERSION" --notes "$COMMIT_DESC" --target ${{ github.sha }} || echo "Release already exists or failed (ignoring)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
